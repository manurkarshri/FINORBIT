<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
    <meta name="description" content="FinOrbit — Your Complete Financial World. A local-first personal finance and wealth PWA.">
    <meta name="application-name" content="FinOrbit">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Transactions · FinOrbit</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./src/styles/tokens.css">
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
    <link rel="stylesheet" href="./src/styles/components.css">
    <link rel="stylesheet" href="./src/styles/utilities.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app" class="app-shell" data-app-status="loading">
      <header id="app-header" class="app-header" aria-label="FinOrbit header"></header>
      <nav id="primary-navigation" class="primary-navigation" aria-label="Primary navigation"></nav>
      <main id="main-content" class="main-content" tabindex="-1">
        <div class="loading-state" role="status" aria-label="Loading FinOrbit">
          <span class="loading-state__mark" aria-hidden="true"></span>
          <p>Preparing your financial world…</p>
        </div>
      </main>
      <aside id="status-region" class="status-region" aria-label="Application status"></aside>
    </div>
    <div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./src/app/bootstrap.js"></script>
  </body>
</html>
